version: "1.0"

# multi-agent サンプル: orchestrator → researcher → writer
start_at: "orchestrator"
end_at:
  - "finish"

nodes:
  - id: "orchestrator"
    handler: "orchestrator_handler"
    params:
      prompt_ref: "prompts.yaml#orchestrator"
      model:
        provider: "openai"
        name: "gpt-4o-mini"
        kwargs:
          temperature: 0.2
      output_key: "orchestrator_plan"

  - id: "researcher"
    handler: "researcher_handler"
    params:
      prompt_ref: "prompts.yaml#researcher"
      model:
        provider: "openai"
        name: "gpt-4o-mini"
        kwargs:
          temperature: 0.3
      output_key: "research_result"

  - id: "writer"
    handler: "llm"
    params:
      prompt_ref: "prompts.yaml#writer"
      model:
        provider: "openai"
        name: "gpt-4o-mini"
        kwargs:
          temperature: 0.7
      output_key: "final_output"

  - id: "finish"
    handler: "finish_handler"

edges:
  - source: "orchestrator"
    target: "researcher"
  - source: "researcher"
    target: "researcher"
    condition: "retry"
  - source: "researcher"
    target: "writer"
    condition: "done"
  - source: "writer"
    target: "finish"
