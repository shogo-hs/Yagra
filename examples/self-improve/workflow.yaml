version: "1.0"
start_at: "generate"
end_at:
  - "judge"

nodes:
  - id: "generate"
    handler: "llm"
    params:
      prompt_ref: "prompts.yaml#generate"
      model:
        provider: "openai"
        name: "gpt-4o-mini"
        kwargs:
          temperature: 0.7
      output_key: "draft"

  - id: "judge"
    handler: "judge"
    params:
      provider: "claude_agent_sdk"
      model: "sonnet"
      prompt_ref: "prompts.yaml#judge"
      rubric:
        description: "Evaluate the draft for clarity and accuracy"
        criteria:
          - name: "clarity"
            description: "Is the output clear and easy to understand?"
            scale: { min: 1, max: 5 }
          - name: "accuracy"
            description: "Does the output match the requested spec?"
            scale: { min: 1, max: 5 }
      output_key: "judge_result"

edges:
  - source: "generate"
    target: "judge"
