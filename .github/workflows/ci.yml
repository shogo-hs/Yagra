name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest (unit + integration)
        run: uv run pytest -q --cov=src/yagra --cov-report=xml --ignore=tests/integration/test_studio_js_utils.py

      - name: Pytest (Playwright JS utils)
        run: uv run pytest -q tests/integration/test_studio_js_utils.py --browser chromium

      - name: Run octocov
        uses: k1LoW/octocov-action@v1
