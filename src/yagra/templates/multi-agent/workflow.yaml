version: "1.0"

# multi-agent テンプレート
# ユースケース: 複数の専門エージェントが協調してタスクを処理するパターン
#
# フロー:
#   orchestrator → researcher -[done]→ writer → finish
#                            -[retry]→ researcher（再調査ループ）
#
# 使い方:
#   1. handler を実装して registry に登録してください
#   2. prompts/multi_agent_prompts.yaml のプロンプトをカスタマイズしてください
#   3. yagra validate --workflow workflow.yaml で検証してください

start_at: "orchestrator"
end_at:
  - "finish"

params:
  workflow_name: "multi-agent-example"

nodes:
  - id: "orchestrator"
    handler: "orchestrator_handler"
    params:
      prompt_ref: "prompts/multi_agent_prompts.yaml#orchestrator"
      model:
        provider: "openai"
        name: "gpt-4o-mini"
        kwargs:
          temperature: 0.2
      output_key: "orchestrator_plan"

  - id: "researcher"
    handler: "llm"
    params:
      prompt_ref: "prompts/multi_agent_prompts.yaml#researcher"
      model:
        provider: "openai"
        name: "gpt-4o-mini"
        kwargs:
          temperature: 0.3
      output_key: "research_result"

  - id: "writer"
    handler: "llm"
    params:
      prompt_ref: "prompts/multi_agent_prompts.yaml#writer"
      model:
        provider: "openai"
        name: "gpt-4o-mini"
        kwargs:
          temperature: 0.7
      output_key: "final_output"

  - id: "finish"
    handler: "finish_handler"

edges:
  - source: "orchestrator"
    target: "researcher"
  - source: "researcher"
    target: "researcher"
    condition: "retry"
  - source: "researcher"
    target: "writer"
    condition: "done"
  - source: "writer"
    target: "finish"
