version: "1.0"
start_at: "planner"
end_at:
  - "finish"

params:
  prompt_catalog: "prompts/support_prompts.yaml"

nodes:
  - id: "planner"
    handler: "planner_loop_handler"
    params:
      prompt_ref: "planner"
      model:
        provider: "openai"
        name: "gpt-4.1-mini"
        kwargs:
          temperature: 0.1
          max_tokens: 256
  - id: "evaluator"
    handler: "evaluator_loop_handler"
    params:
      prompt_ref: "evaluator"
      model:
        provider: "openai"
        name: "gpt-4.1-mini"
        kwargs:
          temperature: 0.1
          max_tokens: 256
  - id: "finish"
    handler: "finish_handler"
    params:
      prompt_ref: "finish"
      model:
        provider: "openai"
        name: "gpt-4.1-mini"
        kwargs:
          temperature: 0.1
          max_tokens: 256

edges:
  - source: "planner"
    target: "evaluator"
  - source: "evaluator"
    target: "planner"
    condition: "retry"
  - source: "evaluator"
    target: "finish"
    condition: "done"
